<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>My Profile - NOVA</title>
  <link rel="stylesheet" href="/css/base.css">
  <link rel="stylesheet" href="/css/components.css">
  <link rel="stylesheet" href="/css/pages.css">
</head>
<body>
  <div id="navbar"></div>
  <main class="main-content">
    <div class="container">
      <h1 class="mb-4" data-testid="profile-title">My Account</h1>
      <div class="profile-layout">
        <nav class="profile-nav" data-testid="profile-nav">
          <a href="#" class="active" data-tab="profile" data-testid="tab-profile">Profile</a>
          <a href="#" data-tab="password" data-testid="tab-password">Change Password</a>
          <a href="/orders.html" data-testid="tab-orders">Order History</a>
        </nav>
        <div id="profile-content" data-testid="profile-content"></div>
      </div>
    </div>
  </main>
  <div id="footer"></div>
  <script src="/js/api.js"></script>
  <script src="/js/utils.js"></script>
  <script src="/js/auth.js"></script>
  <script>
    if (!requireAuth()) throw new Error('Auth required');

    let userData = null;

    async function loadProfile() {
      const res = await users.getProfile();
      userData = res.data.user;
      renderProfileTab();
    }

    function renderProfileTab() {
      document.getElementById('profile-content').innerHTML = `
        <div class="card"><div class="card-header">Personal Information</div><div class="card-body">
          <div id="profile-alert"></div>
          <form id="profile-form" data-testid="profile-form">
            <div class="form-row">
              <div class="form-group"><label class="form-label">First Name</label><input name="firstName" class="form-input" required data-testid="profile-first-name" value="${userData.first_name}"></div>
              <div class="form-group"><label class="form-label">Last Name</label><input name="lastName" class="form-input" required data-testid="profile-last-name" value="${userData.last_name}"></div>
            </div>
            <div class="form-group"><label class="form-label">Email</label><input class="form-input" value="${userData.email}" disabled data-testid="profile-email"><div class="form-hint">Email cannot be changed</div></div>
            <div class="form-group"><label class="form-label">Phone</label><input name="phone" class="form-input" data-testid="profile-phone" value="${userData.phone || ''}"></div>
            <div class="form-group"><label class="form-label">Address</label><input name="address" class="form-input" data-testid="profile-address" value="${userData.address || ''}"></div>
            <div class="form-row">
              <div class="form-group"><label class="form-label">City</label><input name="city" class="form-input" data-testid="profile-city" value="${userData.city || ''}"></div>
              <div class="form-group"><label class="form-label">State</label><input name="state" class="form-input" data-testid="profile-state" value="${userData.state || ''}"></div>
            </div>
            <div class="form-row">
              <div class="form-group"><label class="form-label">ZIP</label><input name="zip" class="form-input" data-testid="profile-zip" value="${userData.zip || ''}"></div>
              <div class="form-group"><label class="form-label">Country</label><input name="country" class="form-input" data-testid="profile-country" value="${userData.country || 'US'}"></div>
            </div>
            <button type="submit" class="btn btn-primary" data-testid="profile-save">Save Changes</button>
          </form>
        </div></div>`;

      document.getElementById('profile-form').addEventListener('submit', async (e) => {
        e.preventDefault();
        const fd = new FormData(e.target);
        try {
          const res = await users.updateProfile(Object.fromEntries(fd));
          userData = res.data.user;
          setCurrentUser(userData);
          document.getElementById('profile-alert').innerHTML = '<div class="alert alert-success" data-testid="profile-success">Profile updated successfully</div>';
        } catch (err) {
          document.getElementById('profile-alert').innerHTML = `<div class="alert alert-error" data-testid="profile-error">${err.message}</div>`;
        }
      });
    }

    function renderPasswordTab() {
      document.getElementById('profile-content').innerHTML = `
        <div class="card"><div class="card-header">Change Password</div><div class="card-body">
          <div id="password-alert"></div>
          <form id="password-form" data-testid="password-form">
            <div class="form-group"><label class="form-label">Current Password</label><input type="password" name="currentPassword" class="form-input" required data-testid="current-password"></div>
            <div class="form-group"><label class="form-label">New Password</label><input type="password" name="newPassword" class="form-input" required data-testid="new-password"><div class="form-hint">Min 8 chars, uppercase, lowercase, and number</div></div>
            <div class="form-group"><label class="form-label">Confirm New Password</label><input type="password" name="confirmPassword" class="form-input" required data-testid="confirm-new-password"></div>
            <button type="submit" class="btn btn-primary" data-testid="password-save">Update Password</button>
          </form>
        </div></div>`;

      document.getElementById('password-form').addEventListener('submit', async (e) => {
        e.preventDefault();
        const form = e.target;
        if (form.newPassword.value !== form.confirmPassword.value) {
          document.getElementById('password-alert').innerHTML = '<div class="alert alert-error">Passwords do not match</div>';
          return;
        }
        try {
          await users.changePassword({ currentPassword: form.currentPassword.value, newPassword: form.newPassword.value });
          document.getElementById('password-alert').innerHTML = '<div class="alert alert-success" data-testid="password-success">Password changed successfully</div>';
          form.reset();
        } catch (err) {
          document.getElementById('password-alert').innerHTML = `<div class="alert alert-error" data-testid="password-error">${err.message}</div>`;
        }
      });
    }

    document.querySelectorAll('.profile-nav a[data-tab]').forEach(link => {
      link.addEventListener('click', (e) => {
        e.preventDefault();
        document.querySelectorAll('.profile-nav a').forEach(a => a.classList.remove('active'));
        link.classList.add('active');
        if (link.dataset.tab === 'profile') renderProfileTab();
        else if (link.dataset.tab === 'password') renderPasswordTab();
      });
    });

    loadProfile();
  </script>
</body>
</html>
