<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Register - NOVA</title>
  <link rel="stylesheet" href="/css/base.css">
  <link rel="stylesheet" href="/css/components.css">
</head>
<body>
  <div id="navbar"></div>
  <div class="auth-container">
    <div class="auth-card card">
      <div class="card-body">
        <h1 class="auth-title" data-testid="register-title">Create Account</h1>
        <p class="auth-subtitle">Join NOVA and start shopping</p>
        <div id="register-alert"></div>
        <form id="register-form" data-testid="register-form">
          <div class="form-row">
            <div class="form-group">
              <label class="form-label" for="firstName">First Name</label>
              <input type="text" id="firstName" name="firstName" class="form-input" required data-testid="register-first-name">
            </div>
            <div class="form-group">
              <label class="form-label" for="lastName">Last Name</label>
              <input type="text" id="lastName" name="lastName" class="form-input" required data-testid="register-last-name">
            </div>
          </div>
          <div class="form-group">
            <label class="form-label" for="email">Email</label>
            <input type="email" id="email" name="email" class="form-input" required data-validate="email" data-testid="register-email">
          </div>
          <div class="form-group">
            <label class="form-label" for="phone">Phone (optional)</label>
            <input type="tel" id="phone" name="phone" class="form-input" data-testid="register-phone">
          </div>
          <div class="form-group">
            <label class="form-label" for="password">Password</label>
            <input type="password" id="password" name="password" class="form-input" required data-validate="password" data-testid="register-password">
            <div class="form-hint">Min 8 chars, uppercase, lowercase, and number required</div>
          </div>
          <div class="form-group">
            <label class="form-label" for="confirmPassword">Confirm Password</label>
            <input type="password" id="confirmPassword" name="confirmPassword" class="form-input" required data-testid="register-confirm-password">
          </div>
          <button type="submit" class="btn btn-primary btn-block btn-lg" data-testid="register-submit" id="register-btn">Create Account</button>
        </form>
        <div class="auth-footer">
          Already have an account? <a href="/login.html" data-testid="login-link">Sign in</a>
        </div>
        <div class="text-center mt-2">
          <a href="/products.html" class="btn btn-secondary" id="browse-products-guest-btn" data-testid="browse-products-guest-btn">Browse products as guest</a>
        </div>
      </div>
    </div>
  </div>
  <div id="footer"></div>
  <script src="/js/api.js"></script>
  <script src="/js/utils.js"></script>
  <script src="/js/auth.js"></script>
  <script>
    document.getElementById('register-form').addEventListener('submit', async (e) => {
      e.preventDefault();
      const form = e.target;
      const errors = validateForm(form);

      if (form.password.value !== form.confirmPassword.value) {
        errors.confirmPassword = 'Passwords do not match';
      }
      if (Object.keys(errors).length) { displayFormErrors(form, errors); return; }

      const btn = document.getElementById('register-btn');
      btn.disabled = true;
      btn.textContent = 'Creating account...';

      try {
        const res = await auth.register({
          email: form.email.value,
          password: form.password.value,
          firstName: form.firstName.value,
          lastName: form.lastName.value,
          phone: form.phone.value || undefined,
        });
        api.setToken(res.data.token);
        setCurrentUser(res.data.user);
        showToast('Account created successfully!', 'success');
        window.location.href = '/';
      } catch (err) {
        document.getElementById('register-alert').innerHTML = `<div class="alert alert-error" data-testid="register-error">${err.message}</div>`;
        btn.disabled = false;
        btn.textContent = 'Create Account';
      }
    });
  </script>
</body>
</html>
