<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Order Confirmed - NOVA</title>
  <link rel="stylesheet" href="/css/base.css">
  <link rel="stylesheet" href="/css/components.css">
  <link rel="stylesheet" href="/css/pages.css">
</head>
<body>
  <div id="navbar"></div>
  <main class="main-content">
    <div class="container">
      <div class="confirmation-card card" data-testid="confirmation-card">
        <div class="confirmation-icon" data-testid="confirmation-icon">✓</div>
        <h1 data-testid="confirmation-title">Order Confirmed!</h1>
        <p class="text-muted">Thank you for your purchase. Your order has been placed successfully.</p>
        <div class="confirmation-order-number" id="order-number" data-testid="order-number"></div>
        <div id="order-details" class="mt-3" data-testid="order-details"></div>
        <div class="flex gap-2" style="justify-content:center;margin-top:2rem">
          <a href="/orders.html" class="btn btn-primary" data-testid="view-orders-btn">View Orders</a>
          <a href="/products.html" class="btn btn-secondary" data-testid="continue-shopping-btn">Continue Shopping</a>
        </div>
      </div>
    </div>
  </main>
  <div id="footer"></div>
  <script src="/js/api.js"></script>
  <script src="/js/utils.js"></script>
  <script src="/js/auth.js"></script>
  <script>
    if (!requireAuth()) throw new Error('Auth required');

    const params = getQueryParams();
    const saved = JSON.parse(localStorage.getItem('nova_last_order') || 'null');

    if (params.order) {
      document.getElementById('order-number').textContent = `Order #${params.order}`;
    }

    if (saved) {
      const { order, items } = saved;
      document.getElementById('order-details').innerHTML = `
        <div class="cart-summary" style="text-align:left;max-width:400px;margin:0 auto">
          <div class="cart-summary-row"><span>Date</span><span data-testid="order-date">${formatDateTime(order.created_at)}</span></div>
          <div class="cart-summary-row"><span>Status</span><span>${getStatusBadge(order.status)}</span></div>
          <div class="cart-summary-row"><span>Items</span><span data-testid="order-item-count">${items.length}</span></div>
          <div class="cart-summary-row total"><span>Total</span><span data-testid="order-total">${formatPrice(order.total)}</span></div>
        </div>`;
      localStorage.removeItem('nova_last_order');
    }
  </script>
</body>
</html>
