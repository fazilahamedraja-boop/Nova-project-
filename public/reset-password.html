<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Reset Password - NOVA</title>
  <link rel="stylesheet" href="/css/base.css">
  <link rel="stylesheet" href="/css/components.css">
</head>
<body>
  <div id="navbar"></div>
  <div class="auth-container">
    <div class="auth-card card">
      <div class="card-body">
        <h1 class="auth-title" data-testid="reset-title">Reset Password</h1>
        <p class="auth-subtitle">Enter your new password</p>
        <div id="reset-alert"></div>
        <form id="reset-form" data-testid="reset-form">
          <div class="form-group">
            <label class="form-label" for="token">Reset Token</label>
            <input type="text" id="token" name="token" class="form-input" required data-testid="reset-token-input">
          </div>
          <div class="form-group">
            <label class="form-label" for="password">New Password</label>
            <input type="password" id="password" name="password" class="form-input" required data-validate="password" data-testid="reset-password">
            <div class="form-hint">Min 8 chars, uppercase, lowercase, and number required</div>
          </div>
          <div class="form-group">
            <label class="form-label" for="confirmPassword">Confirm Password</label>
            <input type="password" id="confirmPassword" name="confirmPassword" class="form-input" required data-testid="reset-confirm-password">
          </div>
          <button type="submit" class="btn btn-primary btn-block" data-testid="reset-submit">Reset Password</button>
        </form>
        <div class="auth-footer">
          <a href="/login.html" data-testid="back-to-login">← Back to Login</a>
        </div>
      </div>
    </div>
  </div>
  <div id="footer"></div>
  <script src="/js/api.js"></script>
  <script src="/js/utils.js"></script>
  <script src="/js/auth.js"></script>
  <script>
    const savedToken = localStorage.getItem('nova_reset_token');
    if (savedToken) document.getElementById('token').value = savedToken;

    document.getElementById('reset-form').addEventListener('submit', async (e) => {
      e.preventDefault();
      const form = e.target;
      if (form.password.value !== form.confirmPassword.value) {
        document.getElementById('reset-alert').innerHTML = '<div class="alert alert-error" data-testid="reset-error">Passwords do not match</div>';
        return;
      }
      try {
        await auth.resetPassword({ token: form.token.value, password: form.password.value });
        localStorage.removeItem('nova_reset_token');
        document.getElementById('reset-alert').innerHTML = '<div class="alert alert-success" data-testid="reset-success">Password reset successful! Redirecting to login...</div>';
        setTimeout(() => window.location.href = '/login.html', 2000);
      } catch (err) {
        document.getElementById('reset-alert').innerHTML = `<div class="alert alert-error" data-testid="reset-error">${err.message}</div>`;
      }
    });
  </script>
</body>
</html>
