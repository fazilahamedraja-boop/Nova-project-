<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>My Orders - NOVA</title>
  <link rel="stylesheet" href="/css/base.css">
  <link rel="stylesheet" href="/css/components.css">
</head>
<body>
  <div id="navbar"></div>
  <main class="main-content">
    <div class="container">
      <h1 class="mb-4" data-testid="orders-title">My Orders</h1>
      <div class="flex gap-2 mb-3">
        <select id="status-filter" class="form-select" style="width:auto" data-testid="order-status-filter">
          <option value="">All Statuses</option>
          <option value="pending">Pending</option>
          <option value="confirmed">Confirmed</option>
          <option value="processing">Processing</option>
          <option value="shipped">Shipped</option>
          <option value="delivered">Delivered</option>
          <option value="cancelled">Cancelled</option>
        </select>
      </div>
      <div id="orders-content" data-testid="orders-content"></div>
      <div id="pagination"></div>
    </div>
  </main>
  <div id="footer"></div>
  <script src="/js/api.js"></script>
  <script src="/js/utils.js"></script>
  <script src="/js/auth.js"></script>
  <script>
    if (!requireAuth()) throw new Error('Auth required');
    let currentPage = 1;

    async function loadOrders() {
      const container = document.getElementById('orders-content');
      showLoading(container);
      try {
        const status = document.getElementById('status-filter').value;
        const params = { page: currentPage, limit: 10 };
        if (status) params.status = status;
        const res = await orders.list(params);

        if (res.data.orders.length === 0) {
          showEmpty(container, '📦', 'No orders yet', 'When you place an order, it will appear here.',
            '<a href="/products.html" class="btn btn-primary mt-3" data-testid="start-shopping">Start Shopping</a>');
          return;
        }

        container.innerHTML = `<div class="table-wrapper"><table data-testid="orders-table">
          <thead><tr><th>Order #</th><th>Date</th><th>Items</th><th>Total</th><th>Status</th><th>Payment</th><th></th></tr></thead>
          <tbody>${res.data.orders.map(o => `
            <tr data-testid="order-row" data-order-id="${o.id}">
              <td data-testid="order-number">${o.order_number}</td>
              <td>${formatDate(o.created_at)}</td>
              <td data-testid="order-items">${o.item_count}</td>
              <td data-testid="order-total">${formatPrice(o.total)}</td>
              <td>${getStatusBadge(o.status)}</td>
              <td>${getStatusBadge(o.payment_status)}</td>
              <td><a href="/order-detail.html?id=${o.id}" class="btn btn-secondary btn-sm" data-testid="view-order-btn">View</a></td>
            </tr>
          `).join('')}</tbody>
        </table></div>`;

        renderPagination(document.getElementById('pagination'), res.data.pagination, (page) => { currentPage = page; loadOrders(); });
      } catch (err) { showError(container, err.message); }
    }

    document.getElementById('status-filter').addEventListener('change', () => { currentPage = 1; loadOrders(); });
    loadOrders();
  </script>
</body>
</html>
