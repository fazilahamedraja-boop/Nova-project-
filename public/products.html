<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Products - NOVA</title>
  <link rel="stylesheet" href="/css/base.css">
  <link rel="stylesheet" href="/css/components.css">
  <link rel="stylesheet" href="/css/pages.css">
</head>
<body>
  <div id="navbar"></div>
  <main class="main-content" id="main-content" data-testid="main-content">
    <div class="container">
      <h1 class="mb-4" data-testid="products-title">All Products</h1>
      <div class="catalog-layout">
        <aside class="filters-sidebar" data-testid="filters-sidebar">
          <h3 class="mb-3">Filters</h3>
          <div class="form-group">
            <label class="form-label">Search</label>
            <input type="text" id="filter-search" class="form-input" placeholder="Search products..." data-testid="filter-search">
          </div>
          <div class="filter-group">
            <h4>Category</h4>
            <div id="filter-categories" data-testid="filter-categories"></div>
          </div>
          <div class="filter-group">
            <h4>Brand</h4>
            <div id="filter-brands" data-testid="filter-brands"></div>
          </div>
          <div class="filter-group">
            <h4>Price Range</h4>
            <div class="form-row">
              <input type="number" id="filter-min-price" class="form-input" placeholder="Min" data-testid="filter-min-price">
              <input type="number" id="filter-max-price" class="form-input" placeholder="Max" data-testid="filter-max-price">
            </div>
          </div>
          <div class="filter-group">
            <label class="filter-option">
              <input type="checkbox" id="filter-in-stock" data-testid="filter-in-stock"> In Stock Only
            </label>
          </div>
          <button class="btn btn-secondary btn-block" id="clear-filters" data-testid="clear-filters">Clear Filters</button>
        </aside>
        <div>
          <div class="catalog-toolbar">
            <span class="catalog-results" id="results-count" data-testid="results-count"></span>
            <div class="catalog-sort">
              <label>Sort by:</label>
              <select id="sort-select" data-testid="sort-select">
                <option value="created_at-desc">Newest</option>
                <option value="price-asc">Price: Low to High</option>
                <option value="price-desc">Price: High to Low</option>
                <option value="name-asc">Name: A-Z</option>
                <option value="rating-desc">Top Rated</option>
              </select>
            </div>
          </div>
          <div class="grid grid-3" id="products-grid" data-testid="products-grid"></div>
          <div id="pagination" data-testid="pagination-container"></div>
        </div>
      </div>
    </div>
  </main>
  <div id="footer"></div>
  <script src="/js/api.js"></script>
  <script src="/js/utils.js"></script>
  <script src="/js/auth.js"></script>
  <script>
    let currentPage = 1;
    let filters = { search: '', category: '', brand: '', minPrice: '', maxPrice: '', inStock: false, sort: 'created_at', order: 'desc' };

    async function loadFilters() {
      const res = await products.filters();
      const params = getQueryParams();
      if (params.category) filters.category = params.category;

      document.getElementById('filter-categories').innerHTML = res.data.categories.map(c => `
        <label class="filter-option">
          <input type="radio" name="category" value="${c}" ${filters.category === c ? 'checked' : ''} data-testid="filter-category-${c}">
          ${c}
        </label>
      `).join('') + '<label class="filter-option"><input type="radio" name="category" value="" data-testid="filter-category-all"> All</label>';

      document.getElementById('filter-brands').innerHTML = res.data.brands.map(b => `
        <label class="filter-option">
          <input type="checkbox" name="brand" value="${b}" data-testid="filter-brand-${b}"> ${b}
        </label>
      `).join('');
    }

    async function loadProducts() {
      const container = document.getElementById('products-grid');
      showLoading(container);
      try {
        const params = { page: currentPage, limit: 12, sort: filters.sort, order: filters.order };
        if (filters.search) params.search = filters.search;
        if (filters.category) params.category = filters.category;
        if (filters.brand) params.brand = filters.brand;
        if (filters.minPrice) params.minPrice = filters.minPrice;
        if (filters.maxPrice) params.maxPrice = filters.maxPrice;
        if (filters.inStock) params.inStock = 'true';

        const res = await products.list(params);
        const { products: items, pagination } = res.data;

        document.getElementById('results-count').textContent = `Showing ${items.length} of ${pagination.total} products`;

        if (items.length === 0) {
          showEmpty(container, '🔍', 'No products found', 'Try adjusting your filters or search terms.');
          return;
        }

        container.innerHTML = items.map(renderProductCard).join('');
        bindCartButtons(container);
        renderPagination(document.getElementById('pagination'), pagination, (page) => { currentPage = page; loadProducts(); window.scrollTo(0, 0); });
      } catch (err) {
        showError(container, err.message);
      }
    }

    function bindCartButtons(container) {
      container.querySelectorAll('[data-action="add-to-cart"]').forEach(btn => {
        btn.addEventListener('click', async () => {
          if (!api.getToken()) { window.location.href = '/login.html'; return; }
          try { await cart.add(parseInt(btn.dataset.productId)); showToast('Added to cart!', 'success'); }
          catch (err) { showToast(err.message, 'error'); }
        });
      });
    }

    function applyFilters() {
      filters.search = document.getElementById('filter-search').value;
      filters.minPrice = document.getElementById('filter-min-price').value;
      filters.maxPrice = document.getElementById('filter-max-price').value;
      filters.inStock = document.getElementById('filter-in-stock').checked;
      const catRadio = document.querySelector('input[name="category"]:checked');
      filters.category = catRadio ? catRadio.value : '';
      const brandCheck = document.querySelector('input[name="brand"]:checked');
      filters.brand = brandCheck ? brandCheck.value : '';
      const [sort, order] = document.getElementById('sort-select').value.split('-');
      filters.sort = sort;
      filters.order = order;
      currentPage = 1;
      loadProducts();
    }

    document.getElementById('filter-search').addEventListener('input', debounce(applyFilters, 400));
    document.getElementById('sort-select').addEventListener('change', applyFilters);
    document.getElementById('filter-in-stock').addEventListener('change', applyFilters);
    document.getElementById('filter-min-price').addEventListener('change', applyFilters);
    document.getElementById('filter-max-price').addEventListener('change', applyFilters);
    document.getElementById('clear-filters').addEventListener('click', () => {
      document.getElementById('filter-search').value = '';
      document.getElementById('filter-min-price').value = '';
      document.getElementById('filter-max-price').value = '';
      document.getElementById('filter-in-stock').checked = false;
      document.querySelectorAll('input[name="category"]').forEach(r => r.checked = false);
      document.querySelectorAll('input[name="brand"]').forEach(c => c.checked = false);
      filters = { search: '', category: '', brand: '', minPrice: '', maxPrice: '', inStock: false, sort: 'created_at', order: 'desc' };
      currentPage = 1;
      loadProducts();
    });

    document.addEventListener('change', (e) => {
      if (e.target.name === 'category' || e.target.name === 'brand') applyFilters();
    });

    loadFilters().then(loadProducts);
  </script>
</body>
</html>
