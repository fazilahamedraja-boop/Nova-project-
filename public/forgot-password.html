<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Forgot Password - NOVA</title>
  <link rel="stylesheet" href="/css/base.css">
  <link rel="stylesheet" href="/css/components.css">
</head>
<body>
  <div id="navbar"></div>
  <div class="auth-container">
    <div class="auth-card card">
      <div class="card-body">
        <h1 class="auth-title" data-testid="forgot-title">Forgot Password</h1>
        <p class="auth-subtitle">Enter your email and we'll send you a reset link</p>
        <div id="forgot-alert"></div>
        <form id="forgot-form" data-testid="forgot-form">
          <div class="form-group">
            <label class="form-label" for="email">Email</label>
            <input type="email" id="email" name="email" class="form-input" required data-validate="email" data-testid="forgot-email">
          </div>
          <button type="submit" class="btn btn-primary btn-block" data-testid="forgot-submit">Send Reset Link</button>
        </form>
        <div id="reset-section" class="hidden mt-3">
          <div class="alert alert-info" data-testid="reset-token-info">
            <strong>Dev Mode:</strong> Use this token to reset your password:
            <code id="reset-token" data-testid="reset-token" style="display:block;margin-top:0.5rem;word-break:break-all"></code>
          </div>
          <a href="/reset-password.html" class="btn btn-secondary btn-block mt-2" data-testid="go-to-reset">Go to Reset Password</a>
        </div>
        <div class="auth-footer">
          <a href="/login.html" data-testid="back-to-login">← Back to Login</a>
        </div>
      </div>
    </div>
  </div>
  <div id="footer"></div>
  <script src="/js/api.js"></script>
  <script src="/js/utils.js"></script>
  <script src="/js/auth.js"></script>
  <script>
    document.getElementById('forgot-form').addEventListener('submit', async (e) => {
      e.preventDefault();
      const email = e.target.email.value;
      try {
        const res = await auth.forgotPassword(email);
        document.getElementById('forgot-alert').innerHTML = `<div class="alert alert-success" data-testid="forgot-success">${res.message}</div>`;
        if (res.data?.resetToken) {
          document.getElementById('reset-section').classList.remove('hidden');
          document.getElementById('reset-token').textContent = res.data.resetToken;
          localStorage.setItem('nova_reset_token', res.data.resetToken);
        }
      } catch (err) {
        document.getElementById('forgot-alert').innerHTML = `<div class="alert alert-error" data-testid="forgot-error">${err.message}</div>`;
      }
    });
  </script>
</body>
</html>
