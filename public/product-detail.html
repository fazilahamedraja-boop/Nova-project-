<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Product Details - NOVA</title>
  <link rel="stylesheet" href="/css/base.css">
  <link rel="stylesheet" href="/css/components.css">
  <link rel="stylesheet" href="/css/pages.css">
</head>
<body>
  <div id="navbar"></div>
  <main class="main-content">
    <div class="container" id="product-container" data-testid="product-detail-container">
      <div class="loading-overlay"><div class="spinner"></div></div>
    </div>
  </main>
  <div id="footer"></div>
  <script src="/js/api.js"></script>
  <script src="/js/utils.js"></script>
  <script src="/js/auth.js"></script>
  <script>
    let product = null;
    let quantity = 1;
    let inWishlist = false;

    async function loadProduct() {
      const container = document.getElementById('product-container');
      const params = getQueryParams();
      if (!params.id) { showError(container, 'Product not found'); return; }

      try {
        const res = await products.get(params.id);
        product = res.data.product;
        inWishlist = res.data.inWishlist;
        document.title = `${product.name} - NOVA`;
        renderProduct(container);
      } catch (err) {
        showError(container, err.message);
      }
    }

    function renderProduct(container) {
      const discount = product.compare_price && product.compare_price > product.price;
      const stockClass = product.stock === 0 ? 'stock-out' : product.stock < 10 ? 'stock-low' : 'stock-in';
      const stockText = product.stock === 0 ? 'Out of Stock' : product.stock < 10 ? `Only ${product.stock} left` : 'In Stock';

      container.innerHTML = `
        <nav style="margin-bottom:1.5rem;font-size:0.875rem" data-testid="breadcrumb">
          <a href="/">Home</a> / <a href="/products.html">Products</a> / <span>${product.category}</span>
        </nav>
        <div class="product-detail">
          <div class="product-detail-image">
            <img src="${product.image_url || '/images/products/placeholder.svg'}" alt="${product.name}" data-testid="product-image">
          </div>
          <div class="product-detail-info">
            <div class="product-card-category" data-testid="product-category">${product.category}</div>
            <h1 data-testid="product-name">${product.name}</h1>
            <div class="product-detail-meta">
              <span data-testid="product-brand">Brand: ${product.brand}</span>
              <span data-testid="product-sku">SKU: ${product.sku}</span>
              <span data-testid="product-rating">${renderStars(product.rating)} (${product.review_count} reviews)</span>
            </div>
            <div class="product-detail-price" data-testid="product-price">
              ${formatPrice(product.price)}
              ${discount ? `<span class="price-compare" style="font-size:1.25rem">${formatPrice(product.compare_price)}</span>` : ''}
            </div>
            <p class="stock-status ${stockClass}" data-testid="stock-status">${stockText}</p>
            <p class="product-detail-description" data-testid="product-description">${product.description}</p>
            ${product.stock > 0 ? `
              <div class="qty-selector" data-testid="qty-selector">
                <button type="button" id="qty-minus" data-testid="qty-minus">−</button>
                <input type="number" id="qty-input" value="1" min="1" max="${Math.min(product.stock, 99)}" data-testid="qty-input">
                <button type="button" id="qty-plus" data-testid="qty-plus">+</button>
              </div>
              <div class="product-detail-actions">
                <button class="btn btn-primary btn-lg" id="add-to-cart" data-testid="add-to-cart-btn">Add to Cart</button>
                <button class="btn btn-secondary btn-lg" id="wishlist-btn" data-testid="wishlist-btn">${inWishlist ? '♥ In Wishlist' : '♡ Add to Wishlist'}</button>
              </div>
            ` : '<button class="btn btn-secondary btn-lg" disabled data-testid="out-of-stock-btn">Out of Stock</button>'}
          </div>
        </div>`;

      if (product.stock > 0) bindEvents();
    }

    function bindEvents() {
      document.getElementById('qty-minus').addEventListener('click', () => {
        const input = document.getElementById('qty-input');
        if (input.value > 1) input.value = --quantity;
      });
      document.getElementById('qty-plus').addEventListener('click', () => {
        const input = document.getElementById('qty-input');
        const max = parseInt(input.max);
        if (quantity < max) input.value = ++quantity;
      });
      document.getElementById('qty-input').addEventListener('change', (e) => {
        quantity = Math.max(1, Math.min(parseInt(e.target.value) || 1, parseInt(e.target.max)));
        e.target.value = quantity;
      });

      document.getElementById('add-to-cart').addEventListener('click', async () => {
        if (!api.getToken()) { window.location.href = '/login.html'; return; }
        try {
          await cart.add(product.id, quantity);
          showToast('Added to cart!', 'success');
        } catch (err) { showToast(err.message, 'error'); }
      });

      document.getElementById('wishlist-btn').addEventListener('click', async () => {
        if (!api.getToken()) { window.location.href = '/login.html'; return; }
        try {
          if (inWishlist) {
            await wishlist.remove(product.id);
            inWishlist = false;
            document.getElementById('wishlist-btn').textContent = '♡ Add to Wishlist';
            showToast('Removed from wishlist', 'info');
          } else {
            await wishlist.add(product.id);
            inWishlist = true;
            document.getElementById('wishlist-btn').textContent = '♥ In Wishlist';
            showToast('Added to wishlist!', 'success');
          }
        } catch (err) { showToast(err.message, 'error'); }
      });
    }

    loadProduct();
  </script>
</body>
</html>
