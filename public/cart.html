<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Shopping Cart - NOVA</title>
  <link rel="stylesheet" href="/css/base.css">
  <link rel="stylesheet" href="/css/components.css">
  <link rel="stylesheet" href="/css/pages.css">
</head>
<body>
  <div id="navbar"></div>
  <main class="main-content">
    <div class="container">
      <h1 class="mb-4" data-testid="cart-title">Shopping Cart</h1>
      <div id="cart-content" data-testid="cart-content"></div>
    </div>
  </main>
  <div id="footer"></div>
  <script src="/js/api.js"></script>
  <script src="/js/utils.js"></script>
  <script src="/js/auth.js"></script>
  <script>
    if (!requireAuth()) throw new Error('Auth required');

    async function loadCart() {
      const container = document.getElementById('cart-content');
      showLoading(container);
      try {
        const res = await cart.get();
        const { items, subtotal, itemCount } = res.data;

        if (items.length === 0) {
          showEmpty(container, '🛒', 'Your cart is empty', 'Looks like you haven\'t added anything yet.',
            '<a href="/products.html" class="btn btn-primary mt-3" data-testid="continue-shopping">Continue Shopping</a>');
          return;
        }

        container.innerHTML = `
          <div style="display:grid;grid-template-columns:1fr 340px;gap:2rem;align-items:start">
            <div class="card"><div class="card-body" data-testid="cart-items">
              ${items.map(item => `
                <div class="cart-item" data-testid="cart-item" data-item-id="${item.id}">
                  <div class="cart-item-image">
                    <img src="${item.image_url || '/images/products/placeholder.svg'}" alt="${item.name}" data-testid="cart-item-image">
                  </div>
                  <div class="cart-item-info">
                    <div class="cart-item-name" data-testid="cart-item-name">${item.name}</div>
                    <div class="cart-item-price" data-testid="cart-item-price">${formatPrice(item.price)} each</div>
                    <div class="qty-selector" style="margin-top:0.5rem">
                      <button class="qty-btn" data-action="decrease" data-id="${item.id}" data-testid="cart-qty-minus">−</button>
                      <input type="number" value="${item.quantity}" min="1" max="${item.stock}" data-id="${item.id}" class="qty-input" data-testid="cart-qty-input" style="width:50px;text-align:center;padding:0.25rem">
                      <button class="qty-btn" data-action="increase" data-id="${item.id}" data-testid="cart-qty-plus">+</button>
                    </div>
                  </div>
                  <div class="cart-item-total" data-testid="cart-item-total">${formatPrice(item.price * item.quantity)}</div>
                  <button class="btn-icon" data-action="remove" data-id="${item.id}" data-testid="cart-remove-btn" title="Remove">✕</button>
                </div>
              `).join('')}
            </div></div>
            <div class="cart-summary" data-testid="cart-summary">
              <h3 class="mb-3">Order Summary</h3>
              <div class="cart-summary-row"><span>Items (${itemCount})</span><span data-testid="cart-subtotal">${formatPrice(subtotal)}</span></div>
              <div class="cart-summary-row"><span>Shipping</span><span data-testid="cart-shipping">${subtotal >= 75 ? 'FREE' : formatPrice(9.99)}</span></div>
              <div class="cart-summary-row"><span>Estimated Tax</span><span data-testid="cart-tax">${formatPrice(subtotal * 0.08)}</span></div>
              <div class="cart-summary-row total"><span>Total</span><span data-testid="cart-total">${formatPrice(subtotal + (subtotal >= 75 ? 0 : 9.99) + subtotal * 0.08)}</span></div>
              <a href="/checkout.html" class="btn btn-primary btn-block btn-lg mt-3" data-testid="checkout-btn">Proceed to Checkout</a>
              <a href="/products.html" class="btn btn-secondary btn-block mt-2" data-testid="continue-shopping">Continue Shopping</a>
            </div>
          </div>`;

        bindCartEvents(container);
      } catch (err) {
        showError(container, err.message);
      }
    }

    function bindCartEvents(container) {
      container.querySelectorAll('[data-action="remove"]').forEach(btn => {
        btn.addEventListener('click', async () => {
          try { await cart.remove(btn.dataset.id); showToast('Item removed', 'info'); loadCart(); }
          catch (err) { showToast(err.message, 'error'); }
        });
      });
      container.querySelectorAll('[data-action="decrease"]').forEach(btn => {
        btn.addEventListener('click', async () => {
          const input = container.querySelector(`input[data-id="${btn.dataset.id}"]`);
          const qty = Math.max(1, parseInt(input.value) - 1);
          try { await cart.update(btn.dataset.id, qty); loadCart(); }
          catch (err) { showToast(err.message, 'error'); }
        });
      });
      container.querySelectorAll('[data-action="increase"]').forEach(btn => {
        btn.addEventListener('click', async () => {
          const input = container.querySelector(`input[data-id="${btn.dataset.id}"]`);
          const qty = parseInt(input.value) + 1;
          try { await cart.update(btn.dataset.id, qty); loadCart(); }
          catch (err) { showToast(err.message, 'error'); }
        });
      });
    }

    loadCart();
  </script>
</body>
</html>
