<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Manage Products - NOVA Admin</title>
  <link rel="stylesheet" href="/css/base.css">
  <link rel="stylesheet" href="/css/components.css">
</head>
<body>
  <div id="navbar"></div>
  <div class="admin-layout">
    <aside class="admin-sidebar" data-testid="admin-sidebar">
      <a href="/admin/dashboard.html" data-testid="nav-dashboard">Dashboard</a>
      <a href="/admin/products.html" class="active" data-testid="nav-products">Products</a>
      <a href="/admin/orders.html" data-testid="nav-orders">Orders</a>
      <a href="/admin/users.html" data-testid="nav-users">Users</a>
      <a href="/">← Back to Store</a>
    </aside>
    <div class="admin-content">
      <div class="flex-between mb-4">
        <h1 data-testid="admin-products-title">Products</h1>
        <button class="btn btn-primary" id="add-product-btn" data-testid="add-product-btn">+ Add Product</button>
      </div>
      <div class="flex gap-2 mb-3">
        <input type="text" id="search-input" class="form-input" placeholder="Search products..." style="max-width:300px" data-testid="admin-product-search">
      </div>
      <div id="products-table" data-testid="admin-products-table"></div>
      <div id="pagination"></div>
    </div>
  </div>

  <div id="product-modal" class="modal-overlay hidden" data-testid="product-modal">
    <div class="modal">
      <div class="modal-header"><h3 id="modal-title">Add Product</h3><button class="btn-icon" id="close-modal" data-testid="close-modal">✕</button></div>
      <div class="modal-body">
        <form id="product-form" data-testid="product-form">
          <input type="hidden" id="product-id">
          <div class="form-group"><label class="form-label">Name</label><input name="name" class="form-input" required data-testid="product-name-input"></div>
          <div class="form-group"><label class="form-label">Description</label><textarea name="description" class="form-textarea" rows="3" required data-testid="product-desc-input"></textarea></div>
          <div class="form-row">
            <div class="form-group"><label class="form-label">Price</label><input name="price" type="number" step="0.01" class="form-input" required data-testid="product-price-input"></div>
            <div class="form-group"><label class="form-label">Compare Price</label><input name="comparePrice" type="number" step="0.01" class="form-input" data-testid="product-compare-price-input"></div>
          </div>
          <div class="form-row">
            <div class="form-group"><label class="form-label">Category</label><input name="category" class="form-input" required data-testid="product-category-input"></div>
            <div class="form-group"><label class="form-label">Brand</label><input name="brand" class="form-input" required data-testid="product-brand-input"></div>
          </div>
          <div class="form-row">
            <div class="form-group"><label class="form-label">SKU</label><input name="sku" class="form-input" required data-testid="product-sku-input"></div>
            <div class="form-group"><label class="form-label">Stock</label><input name="stock" type="number" class="form-input" required data-testid="product-stock-input"></div>
          </div>
          <div class="form-group"><label class="form-label">Image URL</label><input name="imageUrl" class="form-input" data-testid="product-image-input"></div>
        </form>
      </div>
      <div class="modal-footer">
        <button class="btn btn-secondary" id="cancel-modal" data-testid="cancel-modal">Cancel</button>
        <button class="btn btn-primary" id="save-product" data-testid="save-product-btn">Save Product</button>
      </div>
    </div>
  </div>

  <script src="/js/api.js"></script>
  <script src="/js/utils.js"></script>
  <script src="/js/auth.js"></script>
  <script>
    if (!api.getToken() || !requireAdmin()) throw new Error('Admin required');
    let currentPage = 1;

    async function loadProducts() {
      const container = document.getElementById('products-table');
      showLoading(container);
      try {
        const search = document.getElementById('search-input').value;
        const res = await admin.products.list({ page: currentPage, limit: 20, search });
        container.innerHTML = `<div class="table-wrapper"><table><thead><tr><th>ID</th><th>Name</th><th>SKU</th><th>Price</th><th>Stock</th><th>Category</th><th>Status</th><th>Actions</th></tr></thead><tbody>
          ${res.data.products.map(p => `<tr data-testid="admin-product-row" data-id="${p.id}">
            <td>${p.id}</td><td>${p.name}</td><td>${p.sku}</td><td>${formatPrice(p.price)}</td>
            <td data-testid="product-stock-${p.id}">${p.stock}</td><td>${p.category}</td>
            <td>${p.is_active ? '<span class="badge badge-success">Active</span>' : '<span class="badge badge-danger">Inactive</span>'}</td>
            <td class="flex gap-1">
              <button class="btn btn-secondary btn-sm" data-action="edit" data-id="${p.id}" data-testid="edit-product-${p.id}">Edit</button>
              <button class="btn btn-danger btn-sm" data-action="delete" data-id="${p.id}" data-testid="delete-product-${p.id}">Delete</button>
            </td>
          </tr>`).join('')}
        </tbody></table></div>`;
        renderPagination(document.getElementById('pagination'), res.data.pagination, (p) => { currentPage = p; loadProducts(); });
        bindTableEvents(container);
      } catch (err) { showError(container, err.message); }
    }

    function bindTableEvents(container) {
      container.querySelectorAll('[data-action="edit"]').forEach(btn => {
        btn.addEventListener('click', () => openEditModal(btn.dataset.id));
      });
      container.querySelectorAll('[data-action="delete"]').forEach(btn => {
        btn.addEventListener('click', async () => {
          if (!confirm('Deactivate this product?')) return;
          try { await admin.products.delete(btn.dataset.id); showToast('Product deactivated', 'success'); loadProducts(); }
          catch (err) { showToast(err.message, 'error'); }
        });
      });
    }

    function openModal(title) {
      document.getElementById('modal-title').textContent = title;
      document.getElementById('product-modal').classList.remove('hidden');
    }

    function closeModal() {
      document.getElementById('product-modal').classList.add('hidden');
      document.getElementById('product-form').reset();
      document.getElementById('product-id').value = '';
    }

    async function openEditModal(id) {
      const res = await admin.products.list({ search: '' });
      const product = res.data.products.find(p => p.id == id) || (await fetch(`/api/products/${id}`).then(r => r.json())).data.product;
      document.getElementById('product-id').value = product.id;
      const form = document.getElementById('product-form');
      form.name.value = product.name;
      form.description.value = product.description;
      form.price.value = product.price;
      form.comparePrice.value = product.compare_price || '';
      form.category.value = product.category;
      form.brand.value = product.brand;
      form.sku.value = product.sku;
      form.stock.value = product.stock;
      form.imageUrl.value = product.image_url || '';
      openModal('Edit Product');
    }

    document.getElementById('add-product-btn').addEventListener('click', () => openModal('Add Product'));
    document.getElementById('close-modal').addEventListener('click', closeModal);
    document.getElementById('cancel-modal').addEventListener('click', closeModal);
    document.getElementById('search-input').addEventListener('input', debounce(() => { currentPage = 1; loadProducts(); }, 400));

    document.getElementById('save-product').addEventListener('click', async () => {
      const form = document.getElementById('product-form');
      const id = document.getElementById('product-id').value;
      const data = {
        name: form.name.value, description: form.description.value,
        price: parseFloat(form.price.value), comparePrice: form.comparePrice.value ? parseFloat(form.comparePrice.value) : null,
        category: form.category.value, brand: form.brand.value,
        sku: form.sku.value, stock: parseInt(form.stock.value), imageUrl: form.imageUrl.value || null,
      };
      try {
        if (id) { await admin.products.update(id, data); showToast('Product updated', 'success'); }
        else { await admin.products.create(data); showToast('Product created', 'success'); }
        closeModal(); loadProducts();
      } catch (err) { showToast(err.message, 'error'); }
    });

    loadProducts();
  </script>
</body>
</html>
