<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Admin Login - NOVA</title>
  <link rel="stylesheet" href="/css/base.css">
  <link rel="stylesheet" href="/css/components.css">
</head>
<body>
  <div class="auth-container" style="min-height:100vh">
    <div class="auth-card card">
      <div class="card-body">
        <h1 class="auth-title" data-testid="admin-login-title">NOVA Admin</h1>
        <p class="auth-subtitle">Sign in to the admin panel</p>
        <div id="login-alert"></div>
        <form id="admin-login-form" data-testid="admin-login-form">
          <div class="form-group">
            <label class="form-label" for="email">Email</label>
            <input type="email" id="email" name="email" class="form-input" required data-testid="admin-login-email" value="admin@nova.com">
          </div>
          <div class="form-group">
            <label class="form-label" for="password">Password</label>
            <input type="password" id="password" name="password" class="form-input" required data-testid="admin-login-password">
          </div>
          <button type="submit" class="btn btn-primary btn-block btn-lg" data-testid="admin-login-submit">Sign In</button>
        </form>
        <div class="auth-footer"><a href="/" data-testid="back-to-store">← Back to Store</a></div>
      </div>
    </div>
  </div>
  <script src="/js/api.js"></script>
  <script src="/js/utils.js"></script>
  <script src="/js/auth.js"></script>
  <script>
    document.getElementById('admin-login-form').addEventListener('submit', async (e) => {
      e.preventDefault();
      const form = e.target;
      try {
        const user = await handleLogin(form.email.value, form.password.value);
        if (user.role !== 'admin') {
          api.setToken(null);
          setCurrentUser(null);
          document.getElementById('login-alert').innerHTML = '<div class="alert alert-error" data-testid="admin-login-error">Admin access required</div>';
          return;
        }
        window.location.href = '/admin/dashboard.html';
      } catch (err) {
        document.getElementById('login-alert').innerHTML = `<div class="alert alert-error" data-testid="admin-login-error">${err.message}</div>`;
      }
    });
  </script>
</body>
</html>
