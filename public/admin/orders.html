<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Manage Orders - NOVA Admin</title>
  <link rel="stylesheet" href="/css/base.css">
  <link rel="stylesheet" href="/css/components.css">
</head>
<body>
  <div id="navbar"></div>
  <div class="admin-layout">
    <aside class="admin-sidebar" data-testid="admin-sidebar">
      <a href="/admin/dashboard.html">Dashboard</a>
      <a href="/admin/products.html">Products</a>
      <a href="/admin/orders.html" class="active" data-testid="nav-orders">Orders</a>
      <a href="/admin/users.html">Users</a>
      <a href="/">← Back to Store</a>
    </aside>
    <div class="admin-content">
      <h1 class="mb-4" data-testid="admin-orders-title">Orders</h1>
      <div class="flex gap-2 mb-3">
        <input type="text" id="search-input" class="form-input" placeholder="Search orders..." style="max-width:300px" data-testid="admin-order-search">
        <select id="status-filter" class="form-select" style="width:auto" data-testid="admin-order-status-filter">
          <option value="">All Statuses</option>
          <option value="pending">Pending</option>
          <option value="confirmed">Confirmed</option>
          <option value="processing">Processing</option>
          <option value="shipped">Shipped</option>
          <option value="delivered">Delivered</option>
          <option value="cancelled">Cancelled</option>
        </select>
      </div>
      <div id="orders-table" data-testid="admin-orders-table"></div>
      <div id="pagination"></div>
    </div>
  </div>

  <div id="order-modal" class="modal-overlay hidden" data-testid="order-modal">
    <div class="modal" style="max-width:600px">
      <div class="modal-header"><h3>Order Details</h3><button class="btn-icon" id="close-modal" data-testid="close-order-modal">✕</button></div>
      <div class="modal-body" id="order-modal-body"></div>
      <div class="modal-footer">
        <select id="status-update" class="form-select" style="width:auto" data-testid="order-status-select">
          <option value="confirmed">Confirmed</option>
          <option value="processing">Processing</option>
          <option value="shipped">Shipped</option>
          <option value="delivered">Delivered</option>
          <option value="cancelled">Cancelled</option>
        </select>
        <button class="btn btn-primary" id="update-status" data-testid="update-status-btn">Update Status</button>
      </div>
    </div>
  </div>

  <script src="/js/api.js"></script>
  <script src="/js/utils.js"></script>
  <script src="/js/auth.js"></script>
  <script>
    if (!api.getToken() || !requireAdmin()) throw new Error('Admin required');
    let currentPage = 1;
    let selectedOrderId = null;

    async function loadOrders() {
      const container = document.getElementById('orders-table');
      showLoading(container);
      try {
        const params = { page: currentPage, limit: 20, search: document.getElementById('search-input').value, status: document.getElementById('status-filter').value };
        const res = await admin.orders.list(params);
        container.innerHTML = `<div class="table-wrapper"><table><thead><tr><th>Order #</th><th>Customer</th><th>Date</th><th>Total</th><th>Status</th><th>Payment</th><th>Actions</th></tr></thead><tbody>
          ${res.data.orders.map(o => `<tr data-testid="admin-order-row" data-id="${o.id}">
            <td data-testid="order-number">${o.order_number}</td><td>${o.customer_name}<br><small class="text-muted">${o.email}</small></td>
            <td>${formatDate(o.created_at)}</td><td>${formatPrice(o.total)}</td>
            <td>${getStatusBadge(o.status)}</td><td>${getStatusBadge(o.payment_status)}</td>
            <td><button class="btn btn-secondary btn-sm" data-action="view" data-id="${o.id}" data-testid="view-order-${o.id}">View</button></td>
          </tr>`).join('')}
        </tbody></table></div>`;
        renderPagination(document.getElementById('pagination'), res.data.pagination, (p) => { currentPage = p; loadOrders(); });
        container.querySelectorAll('[data-action="view"]').forEach(btn => {
          btn.addEventListener('click', () => viewOrder(btn.dataset.id));
        });
      } catch (err) { showError(container, err.message); }
    }

    async function viewOrder(id) {
      selectedOrderId = id;
      const res = await admin.orders.get(id);
      const { order, items } = res.data;
      document.getElementById('status-update').value = order.status;
      document.getElementById('order-modal-body').innerHTML = `
        <p><strong>Order:</strong> ${order.order_number} | <strong>Customer:</strong> ${order.customer_name} (${order.customer_email})</p>
        <p><strong>Shipping:</strong> ${order.shipping_first_name} ${order.shipping_last_name}, ${order.shipping_address}, ${order.shipping_city}, ${order.shipping_state} ${order.shipping_zip}</p>
        <table class="mt-2"><thead><tr><th>Item</th><th>Qty</th><th>Price</th><th>Total</th></tr></thead><tbody>
          ${items.map(i => `<tr><td>${i.product_name}</td><td>${i.quantity}</td><td>${formatPrice(i.unit_price)}</td><td>${formatPrice(i.total_price)}</td></tr>`).join('')}
        </tbody></table>
        <div class="cart-summary mt-2" style="border:none;padding:0">
          <div class="cart-summary-row"><span>Subtotal</span><span>${formatPrice(order.subtotal)}</span></div>
          ${order.discount > 0 ? `<div class="cart-summary-row"><span>Discount</span><span>-${formatPrice(order.discount)}</span></div>` : ''}
          <div class="cart-summary-row"><span>Shipping</span><span>${formatPrice(order.shipping)}</span></div>
          <div class="cart-summary-row"><span>Tax</span><span>${formatPrice(order.tax)}</span></div>
          <div class="cart-summary-row total"><span>Total</span><span>${formatPrice(order.total)}</span></div>
        </div>`;
      document.getElementById('order-modal').classList.remove('hidden');
    }

    document.getElementById('close-modal').addEventListener('click', () => document.getElementById('order-modal').classList.add('hidden'));
    document.getElementById('update-status').addEventListener('click', async () => {
      try {
        await admin.orders.updateStatus(selectedOrderId, document.getElementById('status-update').value);
        showToast('Status updated', 'success');
        document.getElementById('order-modal').classList.add('hidden');
        loadOrders();
      } catch (err) { showToast(err.message, 'error'); }
    });
    document.getElementById('search-input').addEventListener('input', debounce(() => { currentPage = 1; loadOrders(); }, 400));
    document.getElementById('status-filter').addEventListener('change', () => { currentPage = 1; loadOrders(); });

    const params = getQueryParams();
    if (params.id) viewOrder(params.id);
    loadOrders();
  </script>
</body>
</html>
