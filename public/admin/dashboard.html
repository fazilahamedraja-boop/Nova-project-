<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Admin Dashboard - NOVA</title>
  <link rel="stylesheet" href="/css/base.css">
  <link rel="stylesheet" href="/css/components.css">
</head>
<body>
  <div id="navbar"></div>
  <div class="admin-layout">
    <aside class="admin-sidebar" data-testid="admin-sidebar">
      <a href="/admin/dashboard.html" class="active" data-testid="nav-dashboard">Dashboard</a>
      <a href="/admin/products.html" data-testid="nav-products">Products</a>
      <a href="/admin/orders.html" data-testid="nav-orders">Orders</a>
      <a href="/admin/users.html" data-testid="nav-users">Users</a>
      <a href="/" data-testid="nav-store">← Back to Store</a>
    </aside>
    <div class="admin-content" data-testid="admin-content">
      <h1 class="mb-4" data-testid="dashboard-title">Dashboard</h1>
      <div class="stat-cards" id="stats-cards" data-testid="stats-cards"></div>
      <div style="display:grid;grid-template-columns:1fr 1fr;gap:1.5rem">
        <div class="card"><div class="card-header">Recent Orders</div><div class="card-body" id="recent-orders" data-testid="recent-orders"></div></div>
        <div class="card"><div class="card-header">Top Products</div><div class="card-body" id="top-products" data-testid="top-products"></div></div>
      </div>
    </div>
  </div>
  <script src="/js/api.js"></script>
  <script src="/js/utils.js"></script>
  <script src="/js/auth.js"></script>
  <script>
    if (!api.getToken() || !requireAdmin()) throw new Error('Admin required');

    async function loadDashboard() {
      try {
        const res = await admin.dashboard();
        const { stats, recentOrders, topProducts } = res.data;

        document.getElementById('stats-cards').innerHTML = `
          <div class="stat-card" data-testid="stat-users"><div class="stat-card-value">${stats.totalUsers}</div><div class="stat-card-label">Customers</div></div>
          <div class="stat-card" data-testid="stat-products"><div class="stat-card-value">${stats.totalProducts}</div><div class="stat-card-label">Products</div></div>
          <div class="stat-card" data-testid="stat-orders"><div class="stat-card-value">${stats.totalOrders}</div><div class="stat-card-label">Total Orders</div></div>
          <div class="stat-card" data-testid="stat-revenue"><div class="stat-card-value">${formatPrice(stats.totalRevenue)}</div><div class="stat-card-label">Revenue</div></div>
          <div class="stat-card" data-testid="stat-pending"><div class="stat-card-value">${stats.pendingOrders}</div><div class="stat-card-label">Pending Orders</div></div>
          <div class="stat-card" data-testid="stat-low-stock"><div class="stat-card-value">${stats.lowStockProducts}</div><div class="stat-card-label">Low Stock</div></div>`;

        document.getElementById('recent-orders').innerHTML = recentOrders.length ? `<table><thead><tr><th>Order</th><th>Customer</th><th>Total</th><th>Status</th></tr></thead><tbody>
          ${recentOrders.map(o => `<tr data-testid="recent-order"><td><a href="/admin/orders.html?id=${o.id}">${o.order_number}</a></td><td>${o.customer_name}</td><td>${formatPrice(o.total)}</td><td>${getStatusBadge(o.status)}</td></tr>`).join('')}
        </tbody></table>` : '<p class="text-muted">No orders yet</p>';

        document.getElementById('top-products').innerHTML = topProducts.length ? `<table><thead><tr><th>Product</th><th>Sold</th><th>Revenue</th></tr></thead><tbody>
          ${topProducts.map(p => `<tr data-testid="top-product"><td>${p.name}</td><td>${p.total_sold}</td><td>${formatPrice(p.revenue)}</td></tr>`).join('')}
        </tbody></table>` : '<p class="text-muted">No sales data yet</p>';
      } catch (err) { showToast(err.message, 'error'); }
    }

    loadDashboard();
  </script>
</body>
</html>
